---
# ==============================================================================
# Global Kubernetes Configuration
# ==============================================================================
k8s_namespace: "llm-platform"
k8s_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"
k8s_context: "{{ lookup('env', 'K8S_CONTEXT') | default('', true) }}"
k8s_storage_class: "" # Leave empty for cluster default, or set to: hostpath (macOS/Docker Desktop), local-path (k3s), gp3 (AWS EKS), managed-csi (Azure AKS)
deploy_metrics_server: true # Set to false if Metrics Server is already managed/installed on the cluster (e.g. AWS EKS / Azure AKS)

# ==============================================================================
# Database Configuration (PostgreSQL HA / Redundant 2 Replicas)
# ==============================================================================
postgres_replicas: 2
postgres_port: 5432
postgres_db_name: "llm_platform"
postgres_user: "llm_admin"
postgres_password: "PostgresSecurePassword2026!"
postgres_keycloak_db: "keycloak"
postgres_portal_db: "token_portal"
postgres_storage_size: "5Gi"
postgres_service_name: "postgres-service"

# ==============================================================================
# Keycloak Configuration (HA Redundant 2 Replicas)
# ==============================================================================
keycloak_replicas: 2
keycloak_admin_user: "admin"
keycloak_admin_password: "KeycloakMasterAdmin2026!"
keycloak_realm_name: "llm-platform"
keycloak_client_id: "token-portal"
keycloak_client_secret: "token-portal-secret-key-2026"
keycloak_service_name: "keycloak-service"
keycloak_port: 8080
keycloak_http_relative_path: "/auth"

# Initial pre-provisioned users (1 Admin + 3 Example Users)
initial_users:
  - username: "admin"
    email: "admin@example.com"
    password: "AdminPass123!"
    first_name: "System"
    last_name: "Administrator"
    is_admin: true
    initial_tokens: 100000
    monthly_quota: 100000
  - username: "user1"
    email: "user1@example.com"
    password: "User1Pass123!"
    first_name: "Alice"
    last_name: "Engineer"
    is_admin: false
    initial_tokens: 100000
    monthly_quota: 100000
  - username: "user2"
    email: "user2@example.com"
    password: "User2Pass123!"
    first_name: "Bob"
    last_name: "Researcher"
    is_admin: false
    initial_tokens: 100000
    monthly_quota: 100000
  - username: "user3"
    email: "user3@example.com"
    password: "User3Pass123!"
    first_name: "Charlie"
    last_name: "DataScientist"
    is_admin: false
    initial_tokens: 100000
    monthly_quota: 100000

# ==============================================================================
# Qwen 2.5 3B LLM Inference Service Configuration
# Starts at 1 replica, scales dynamically up to 6 replicas when in use
# ==============================================================================
qwen_image: "qwen-llm:2.5-3b"
qwen_model_name: "qwen2.5:3b"
qwen_build_local: true # Set to true to build image locally with Docker; set to false if using pre-pushed image from ECR/ACR/DockerHub
qwen_node_import_enabled: true # Automatically import image into local container nodes (Kind / Docker Desktop / k3d)
qwen_min_replicas: 1
qwen_max_replicas: 6
qwen_hpa_cpu_percent: 80 # Target CPU utilization percentage to trigger gradual autoscaling
qwen_service_name: "qwen-llm-service"
qwen_port: 11434
qwen_storage_size: "10Gi"
qwen_cpu_request: "1000m"
qwen_cpu_limit: "4000m"
qwen_memory_request: "2Gi"
qwen_memory_limit: "6Gi"

# ==============================================================================
# API Gateway & Token Management Web Portal Configuration (Redundant 2 Replicas)
# ==============================================================================
gateway_replicas: 2
gateway_service_name: "api-gateway-service"
gateway_port: 8000
gateway_secret_key: "gateway-session-super-secret-key-change-in-prod"
default_user_token_balance: 100000
default_monthly_token_quota: 100000

# ==============================================================================
# Ingress & External Access Configuration (Docker Desktop friendly)
# ==============================================================================
ingress_enabled: true
ingress_class_name: "nginx"
ingress_host_portal: "localhost" # Accessible at http://localhost
ingress_host_keycloak: "localhost" # Keycloak at http://localhost/auth
ingress_host_api: "localhost" # API at http://localhost/v1

# NodePort Fallback (for direct port access without Ingress Controller on Docker Desktop)
nodeport_portal: 30080
nodeport_keycloak: 30090
nodeport_qwen: 30100

# ==============================================================================
# Observability Stack Configuration (Prometheus, Grafana, Jaeger Tracing)
# ==============================================================================
# Prometheus Configuration (1 Pod)
prometheus_service_name: "prometheus-service"
prometheus_port: 9090
nodeport_prometheus: 30091

# Grafana Configuration (1 Pod)
grafana_service_name: "grafana-service"
grafana_port: 3000
nodeport_grafana: 30085
grafana_admin_user: "admin"
grafana_admin_password: "GrafanaMasterAdmin2026!"

# Jaeger Tracing Configuration (1 Pod)
jaeger_service_name: "jaeger-service"
jaeger_ui_port: 16686
nodeport_jaeger: 30086
jaeger_otlp_http_port: 4318
jaeger_otlp_grpc_port: 4317
