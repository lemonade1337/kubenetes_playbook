---
# ==============================================================================
# Observability Stack Deployment: Prometheus, Grafana, Jaeger Tracing
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Prometheus Deployment (Metrics Collection: PostgreSQL, Keycloak, Gateway)
# ------------------------------------------------------------------------------
- name: Deploy Prometheus ConfigMap
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    state: present
    definition: "{{ lookup('template', 'prometheus-configmap.yml.j2') | from_yaml }}"

- name: Deploy Prometheus Deployment (1 Pod)
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    state: present
    definition: "{{ lookup('template', 'prometheus-deployment.yml.j2') | from_yaml }}"

- name: Deploy Prometheus Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    state: present
    definition: "{{ lookup('template', 'prometheus-service.yml.j2') | from_yaml }}"

# ------------------------------------------------------------------------------
# 2. Jaeger Distributed Tracing Deployment (1 Pod)
# ------------------------------------------------------------------------------
- name: Deploy Jaeger All-in-One Deployment (1 Pod)
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    state: present
    definition: "{{ lookup('template', 'jaeger-deployment.yml.j2') | from_yaml }}"

- name: Deploy Jaeger Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    state: present
    definition: "{{ lookup('template', 'jaeger-service.yml.j2') | from_yaml }}"

# ------------------------------------------------------------------------------
# 3. Grafana Dashboard & Visualization Deployment (1 Pod)
# ------------------------------------------------------------------------------
- name: Deploy Grafana ConfigMaps (DataSources, Dashboards, Providers)
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'grafana-configmap.yml.j2') | from_yaml_all | list }}"

- name: Deploy Grafana Deployment (1 Pod)
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    state: present
    definition: "{{ lookup('template', 'grafana-deployment.yml.j2') | from_yaml }}"

- name: Deploy Grafana Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    state: present
    definition: "{{ lookup('template', 'grafana-service.yml.j2') | from_yaml }}"

# ------------------------------------------------------------------------------
# 4. Wait for Observability Pods to be Ready
# ------------------------------------------------------------------------------
- name: Wait for Prometheus pod to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    kind: Deployment
    namespace: "{{ k8s_namespace }}"
    name: "prometheus"
  register: prom_deploy
  until: >
    prom_deploy.resources is defined and
    (prom_deploy.resources | length > 0) and
    (prom_deploy.resources[0].status.readyReplicas | default(0) >= 1)
  retries: 30
  delay: 10
  ignore_errors: true

- name: Wait for Jaeger pod to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    kind: Deployment
    namespace: "{{ k8s_namespace }}"
    name: "jaeger"
  register: jaeger_deploy
  until: >
    jaeger_deploy.resources is defined and
    (jaeger_deploy.resources | length > 0) and
    (jaeger_deploy.resources[0].status.readyReplicas | default(0) >= 1)
  retries: 30
  delay: 10
  ignore_errors: true

- name: Wait for Grafana pod to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
    context: "{{ k8s_context | default(omit) if k8s_context else omit }}"
    kind: Deployment
    namespace: "{{ k8s_namespace }}"
    name: "grafana"
  register: grafana_deploy
  until: >
    grafana_deploy.resources is defined and
    (grafana_deploy.resources | length > 0) and
    (grafana_deploy.resources[0].status.readyReplicas | default(0) >= 1)
  retries: 30
  delay: 10
  ignore_errors: true
