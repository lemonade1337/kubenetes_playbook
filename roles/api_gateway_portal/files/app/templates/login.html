{% extends "base.html" %}

{% block title %}Sign In - API Gateway{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden backdrop-blur">
        <!-- Glow accent -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 mb-4 transition transform hover:scale-105 duration-200">
                <img src="/static/holstentor.svg" alt="Holstentor Lübeck" class="w-20 h-20 object-contain drop-shadow-xl">
            </div>
            <h1 class="text-2xl font-bold text-white">Sign In to API Gateway</h1>
            <p class="text-sm text-slate-400 mt-1">Access your API keys and token balance</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-950/60 border border-red-800/60 text-red-300 text-sm flex items-start space-x-3">
            <i class="fa-solid fa-circle-exclamation mt-0.5 text-red-400"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                    <input type="text" id="username" name="username" required placeholder="admin or user1" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-key text-sm"></i>
                    </div>
                    <input type="password" id="password" name="password" required placeholder="••••••••" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm transition">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 via-blue-500 to-sky-500 hover:from-blue-500 hover:to-sky-400 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition transform active:scale-[0.99] flex items-center justify-center space-x-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Pre-provisioned user quick buttons -->
        <div class="mt-8 pt-6 border-t border-slate-800/80">
            <p class="text-xs font-medium text-slate-400 mb-2">Quick Sign-In (Pre-configured Users):</p>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="fillCredentials('admin', 'AdminPass123!')" class="px-2.5 py-1.5 bg-blue-950/40 hover:bg-blue-900/50 border border-blue-800/50 rounded-lg text-blue-300 text-xs text-left transition flex items-center justify-between">
                    <span>👑 Admin</span>
                    <span class="text-[10px] text-blue-400/70">100k</span>
                </button>
                <button type="button" onclick="fillCredentials('user1', 'User1Pass123!')" class="px-2.5 py-1.5 bg-slate-800/80 hover:bg-slate-750 border border-slate-700 rounded-lg text-slate-300 text-xs text-left transition flex items-center justify-between">
                    <span>👤 user1</span>
                    <span class="text-[10px] text-blue-400/80">100k</span>
                </button>
                <button type="button" onclick="fillCredentials('user2', 'User2Pass123!')" class="px-2.5 py-1.5 bg-slate-800/80 hover:bg-slate-750 border border-slate-700 rounded-lg text-slate-300 text-xs text-left transition flex items-center justify-between">
                    <span>👤 user2</span>
                    <span class="text-[10px] text-blue-400/80">100k</span>
                </button>
                <button type="button" onclick="fillCredentials('user3', 'User3Pass123!')" class="px-2.5 py-1.5 bg-slate-800/80 hover:bg-slate-750 border border-slate-700 rounded-lg text-slate-300 text-xs text-left transition flex items-center justify-between">
                    <span>👤 user3</span>
                    <span class="text-[10px] text-blue-400/80">100k</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function fillCredentials(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}
</script>
{% endblock %}
