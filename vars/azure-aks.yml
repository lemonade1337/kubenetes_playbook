---
# ==============================================================================
# Environment Configuration: Azure AKS (Azure Kubernetes Service)
# Usage: ansible-playbook -i inventory.ini playbook.yml -e @vars/azure-aks.yml
# ==============================================================================
# Storage configuration for Azure Managed Disks CSI driver
k8s_storage_class: "managed-csi" # or "default"
postgres_storage_size: "10Gi"
qwen_storage_size: "20Gi"

# Metrics Server (set to false if AKS metrics-server addon is already active)
deploy_metrics_server: false

# Container Image Configuration
# Build and push qwen-llm:2.5-3b to Azure Container Registry (ACR), then specify the image URI:
qwen_build_local: false
qwen_node_import_enabled: false
# qwen_image: "<your_acr_name>.azurecr.io/qwen-llm:2.5-3b"
qwen_image: "qwen-llm:2.5-3b"

# Ingress Configuration (NGINX Ingress or Azure Application Gateway Ingress)
ingress_enabled: true
ingress_class_name: "nginx" # or "azure-application-gateway"
ingress_host_portal: "*" # or your custom DNS domain (e.g. "llm.yourdomain.com")
ingress_host_keycloak: "*"
ingress_host_api: "*"

# Azure Application Gateway annotations (uncomment if using AGIC with ingress_class_name: "azure-application-gateway")
# ingress_annotations:
#   appgw.ingress.kubernetes.io/ssl-redirect: "false"
